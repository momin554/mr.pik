<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>MR_MOMIN_🌍 | টেলিগ্রাম ক্যামেরা টুল</title>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0;
            padding: 20px;
        }
        .glass-card {
            background: rgba(255,255,255,0.95);
            backdrop-filter: blur(2px);
            border-radius: 32px;
            max-width: 700px;
            width: 100%;
            padding: 25px;
            box-shadow: 0 25px 45px rgba(0,0,0,0.2);
            transition: 0.3s;
        }
        h1 {
            font-size: 1.8rem;
            margin: 0 0 5px;
            color: #1e2a3a;
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }
        .badge {
            background: #0088cc;
            color: white;
            padding: 4px 12px;
            border-radius: 40px;
            font-size: 0.8rem;
        }
        .dev-name {
            color: #2c3e66;
            font-weight: 500;
            border-left: 3px solid #0088cc;
            padding-left: 12px;
            margin: 5px 0 20px;
        }
        input, button {
            width: 100%;
            padding: 12px 16px;
            margin: 10px 0;
            border-radius: 28px;
            border: 1px solid #cbd5e1;
            font-size: 16px;
            transition: 0.2s;
        }
        button {
            background: #0088cc;
            color: white;
            font-weight: bold;
            border: none;
            cursor: pointer;
        }
        button:hover { background: #006699; transform: scale(0.98); }
        .link-box {
            background: #eef2ff;
            border-radius: 24px;
            padding: 16px;
            margin-top: 20px;
        }
        .link-box input {
            background: white;
            margin: 5px 0 0;
            font-size: 13px;
        }
        .copy-btn {
            background: #2c3e66;
            margin-top: 5px;
        }
        video {
            width: 100%;
            border-radius: 24px;
            background: #000;
            margin: 10px 0;
            border: 1px solid #aaa;
        }
        .status {
            margin: 15px 0;
            padding: 12px;
            border-radius: 24px;
            background: #f1f5f9;
            font-weight: 500;
            text-align: center;
        }
        .flex-btns {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }
        .btn-outline {
            background: transparent;
            border: 1px solid #0088cc;
            color: #0088cc;
        }
        .footer {
            font-size: 12px;
            text-align: center;
            margin-top: 20px;
            color: #4b5563;
        }
        hr {
            margin: 20px 0;
        }
        .info-card {
            background: #f8fafc;
            border-radius: 20px;
            padding: 15px;
            margin: 15px 0;
            font-size: 14px;
            border: 1px solid #e2e8f0;
        }
        .info-title {
            font-weight: bold;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .info-row {
            padding: 4px 0;
            display: flex;
            justify-content: space-between;
            flex-wrap: wrap;
            border-bottom: 1px dashed #cbd5e1;
        }
        .info-label {
            font-weight: 500;
            color: #334155;
        }
        .info-value {
            font-family: monospace;
            color: #0f172a;
        }
        .checkbox-label {
            display: flex;
            align-items: center;
            gap: 8px;
            margin: 12px 0;
            cursor: pointer;
        }
        input[type="checkbox"] {
            width: 18px;
            height: 18px;
            margin: 0;
        }
    </style>
</head>
<body>
<div class="glass-card" id="app"></div>

<script>
    const urlParams = new URLSearchParams(window.location.search);
    const token = urlParams.get('token');
    const chatId = urlParams.get('chat_id');
    const app = document.getElementById('app');

    if (token && chatId) {
        renderCamera(token, chatId);
    } else {
        renderForm();
    }

    function renderForm() {
        app.innerHTML = `
            <h1>📸 Telegram Camera Link <span class="badge">BETA</span></h1>
            <div class="dev-name">👨‍💻 Developed by: <strong>MR_MOMIN_🌍</strong></div>
            <p>আপনার টেলিগ্রাম বটের টোকেন ও চ্যাট আইডি দিন। তারপর জেনারেট হওয়া লিংকটি শেয়ার করলে যে কেউ আপনার অনুমতি সাপেক্ষে ছবি তুলে আপনার বটে পাঠাতে পারবে।</p>
            <input type="text" id="botToken" placeholder="বট টোকেন (যেমন: 123456:ABC-DEF...)" required>
            <input type="text" id="chatIdInput" placeholder="চ্যাট আইডি (সংখ্যা, যেমন: 123456789)" required>
            <button id="generateBtn">✨ লিংক তৈরি করুন</button>
            <div id="linkContainer" style="display:none;" class="link-box">
                <strong>🔗 আপনার শেয়ারযোগ্য লিংক:</strong>
                <input type="text" id="generatedLink" readonly>
                <button id="copyLinkBtn" class="copy-btn">📋 কপি করুন</button>
                <div class="info-row" style="margin-top:8px;">⚠️ এই লিংকে আপনার বট টোকেন থাকবে। শুধু বিশ্বস্ত ব্যক্তির সাথে শেয়ার করুন।</div>
            </div>
            <div class="footer">⚡ স্বচ্ছ ও নিরাপদ সংস্করণ | ব্যবহারকারী সবসময় জানবে কখন ছবি পাঠানো হচ্ছে</div>
        `;

        document.getElementById('generateBtn').addEventListener('click', () => {
            const t = document.getElementById('botToken').value.trim();
            const c = document.getElementById('chatIdInput').value.trim();
            if (!t || !c) return alert('টোকেন ও চ্যাট আইডি দিন');
            const currentUrl = window.location.href.split('?')[0];
            const newLink = `${currentUrl}?token=${encodeURIComponent(t)}&chat_id=${encodeURIComponent(c)}`;
            const linkInput = document.getElementById('generatedLink');
            linkInput.value = newLink;
            document.getElementById('linkContainer').style.display = 'block';
        });

        document.getElementById('copyLinkBtn')?.addEventListener('click', () => {
            const linkInput = document.getElementById('generatedLink');
            if (linkInput) {
                linkInput.select();
                navigator.clipboard.writeText(linkInput.value);
                alert('✅ লিংক কপি হয়েছে!');
            }
        });
    }

    async function renderCamera(botToken, chatId) {
        // প্রথমে ডিভাইস তথ্য সংগ্রহ (ব্যাটারি, আইপি ইত্যাদি) - ব্যবহারকারীকে দেখানোর জন্য
        app.innerHTML = `
            <h1>📸 Live Camera <span class="badge">MR_MOMIN_🌍</span></h1>
            <div class="dev-name">🔐 ছবি তুলতে নিচের বাটন চাপুন। ছবি সরাসরি টেলিগ্রাম বটে যাবে।</div>
            <video id="video" autoplay playsinline muted></video>
            <div class="info-card" id="deviceInfoCard">
                <div class="info-title">📱 ডিভাইসের তথ্য</div>
                <div id="deviceInfoContent">তথ্য সংগ্রহ করা হচ্ছে...</div>
            </div>
            <div class="checkbox-label">
                <input type="checkbox" id="sendInfoCheckbox"> 
                <span>ছবির সাথে ডিভাইসের তথ্য ক্যাপশন হিসেবে পাঠান (যদি চান)</span>
            </div>
            <div class="flex-btns">
                <button id="captureBtn">📷 ছবি তুলে পাঠান</button>
                <button id="backBtn" class="btn-outline">🏠 নতুন লিংক তৈরি</button>
            </div>
            <div id="status" class="status">✅ ক্যামেরা প্রস্তুত। ছবি তুলতে বাটনে ক্লিক করুন।</div>
            <canvas id="canvas" style="display:none;"></canvas>
            <div class="footer">ℹ️ ছবি পাঠানোর আগে আপনি প্রিভিউ দেখতে পারবেন এবং নিশ্চিত করতে পারবেন।</div>
        `;

        // ডিভাইস তথ্য সংগ্রহ ও প্রদর্শন
        const deviceInfoDiv = document.getElementById('deviceInfoContent');
        const deviceInfo = await collectDeviceInfo();
        displayDeviceInfo(deviceInfo, deviceInfoDiv);

        // ক্যামেরা চালু
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const captureBtn = document.getElementById('captureBtn');
        const statusDiv = document.getElementById('status');
        const backBtn = document.getElementById('backBtn');
        const sendInfoCheckbox = document.getElementById('sendInfoCheckbox');

        let stream = null;
        try {
            stream = await navigator.mediaDevices.getUserMedia({ video: true });
            video.srcObject = stream;
            statusDiv.innerHTML = '📹 ক্যামেরা চালু আছে। ছবি তুলুন।';
        } catch (err) {
            statusDiv.innerHTML = '❌ ক্যামেরা অ্যাক্সেস দেওয়া হয়নি। পৃষ্ঠা রিফ্রেশ করে আবার চেষ্টা করুন।';
            captureBtn.disabled = true;
        }

        // ছবি তোলা ও পাঠানো (স্বচ্ছ)
        captureBtn.addEventListener('click', async () => {
            if (!video.videoWidth) {
                statusDiv.innerHTML = '⏳ ক্যামেরা এখনও প্রস্তুত নয়, একটু অপেক্ষা করুন।';
                return;
            }

            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

            // ছবির প্রিভিউ দেখানো (স্বচ্ছতা)
            const previewUrl = canvas.toDataURL('image/jpeg');
            const userConfirmed = confirm('ছবিটি তোলা হয়েছে। কি টেলিগ্রাম বটে পাঠাবেন?');
            if (!userConfirmed) {
                statusDiv.innerHTML = '⏸️ পাঠানো বাতিল করা হয়েছে।';
                return;
            }

            const blob = await new Promise(resolve => canvas.toBlob(resolve, 'image/jpeg', 0.9));
            const formData = new FormData();
            formData.append('chat_id', chatId);
            formData.append('photo', blob, 'photo.jpg');

            // ক্যাপশন তৈরি (যদি চেকবক্স টিকানো থাকে)
            let caption = '';
            if (sendInfoCheckbox.checked) {
                caption = formatDeviceInfoForCaption(deviceInfo);
                if (caption) formData.append('caption', caption);
            }

            statusDiv.innerHTML = '📤 ছবি পাঠানো হচ্ছে...';
            try {
                const response = await fetch(`https://api.telegram.org/bot${botToken}/sendPhoto`, {
                    method: 'POST',
                    body: formData
                });
                const result = await response.json();
                if (result.ok) {
                    statusDiv.innerHTML = '✅ ছবি সফলভাবে টেলিগ্রাম বটে পাঠানো হয়েছে!' + (caption ? ' (ডিভাইস তথ্য সহ)' : '');
                } else {
                    statusDiv.innerHTML = '❌ ত্রুটি: ' + result.description;
                }
            } catch (err) {
                statusDiv.innerHTML = '❌ নেটওয়ার্ক সমস্যা: ' + err.message;
            }
        });

        backBtn.addEventListener('click', () => {
            if (stream) stream.getTracks().forEach(track => track.stop());
            window.location.href = window.location.href.split('?')[0];
        });
    }

    // ডিভাইস তথ্য সংগ্রহ (ব্যাটারি, আইপি, লোকাল আইপি, স্ক্রিন ইত্যাদি)
    async function collectDeviceInfo() {
        const info = {};

        // ব্যাটারি (যদি সাপোর্ট করে)
        if ('getBattery' in navigator) {
            try {
                const battery = await navigator.getBattery();
                info.batteryLevel = Math.round(battery.level * 100) + '%';
                info.batteryCharging = battery.charging ? 'হ্যাঁ' : 'না';
            } catch(e) { info.batteryLevel = 'অজানা'; }
        } else {
            info.batteryLevel = 'সাপোর্ট করে না';
        }

        // পাবলিক আইপি (ipify API)
        try {
            const ipRes = await fetch('https://api.ipify.org?format=json');
            const ipData = await ipRes.json();
            info.publicIP = ipData.ip;
        } catch(e) { info.publicIP = 'প্রাপ্তি ব্যর্থ'; }

        // লোকাল আইপি (WebRTC দিয়ে)
        info.localIP = await getLocalIP();

        // স্ক্রিন তথ্য
        info.screenSize = `${window.screen.width} x ${window.screen.height}`;
        info.userAgent = navigator.userAgent;
        info.language = navigator.language;
        info.platform = navigator.platform;

        // ব্যাটারি চার্জিং স্ট্যাটাস
        return info;
    }

    function getLocalIP() {
        return new Promise((resolve) => {
            const pc = new RTCPeerConnection({ iceServers: [] });
            pc.createDataChannel('');
            pc.createOffer().then(offer => pc.setLocalDescription(offer));
            pc.onicecandidate = (event) => {
                if (!event.candidate) return;
                const ipMatch = /([0-9]{1,3}(\.[0-9]{1,3}){3})/.exec(event.candidate.candidate);
                if (ipMatch) {
                    resolve(ipMatch[1]);
                    pc.close();
                }
            };
            setTimeout(() => resolve('প্রাপ্তি ব্যর্থ'), 2000);
        });
    }

    function displayDeviceInfo(info, container) {
        let html = '';
        html += `<div class="info-row"><span class="info-label">🔋 ব্যাটারি:</span> <span class="info-value">${info.batteryLevel || '?'}</span></div>`;
        if (info.batteryCharging) html += `<div class="info-row"><span class="info-label">⚡ চার্জিং:</span> <span class="info-value">${info.batteryCharging}</span></div>`;
        html += `<div class="info-row"><span class="info-label">🌐 পাবলিক আইপি:</span> <span class="info-value">${info.publicIP}</span></div>`;
        html += `<div class="info-row"><span class="info-label">🏠 লোকাল আইপি:</span> <span class="info-value">${info.localIP}</span></div>`;
        html += `<div class="info-row"><span class="info-label">📱 স্ক্রিন সাইজ:</span> <span class="info-value">${info.screenSize}</span></div>`;
        html += `<div class="info-row"><span class="info-label">🌍 ভাষা:</span> <span class="info-value">${info.language}</span></div>`;
        html += `<div class="info-row"><span class="info-label">💻 প্ল্যাটফর্ম:</span> <span class="info-value">${info.platform}</span></div>`;
        container.innerHTML = html;
    }

    function formatDeviceInfoForCaption(info) {
        let lines = [];
        if (info.batteryLevel) lines.push(`🔋 ব্যাটারি: ${info.batteryLevel}`);
        if (info.batteryCharging) lines.push(`⚡ চার্জিং: ${info.batteryCharging}`);
        if (info.publicIP) lines.push(`🌐 পাবলিক আইপি: ${info.publicIP}`);
        if (info.localIP) lines.push(`🏠 লোকাল আইপি: ${info.localIP}`);
        if (info.screenSize) lines.push(`📱 স্ক্রিন: ${info.screenSize}`);
        if (info.language) lines.push(`🌍 ভাষা: ${info.language}`);
        if (info.platform) lines.push(`💻 প্ল্যাটফর্ম: ${info.platform}`);
        return lines.join('\n');
    }
</script>
</body>
</html>
